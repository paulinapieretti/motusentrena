<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MOTUS ENTRENA — Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFE6; --bg-elev:#FFFFFF; --bg-elev-2:#E2E6D9;
    --text:#12181F; --muted:#555F59; --muted-2:#8C958C;
    --accent:#24398C; --accent-soft:#DEE4F6; --accent-2:#D9401B; --accent-2-dark:#B03415;
    --border:rgba(18,24,31,0.10); --border-strong:rgba(18,24,31,0.26);
    --ok:#2F8F5B; --ok-soft:#E1F1E7; --warn:#C43B27; --warn-soft:#FBE2DC;
    --radius:14px; --font-display:'Big Shoulders Display',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; }
  @media(min-width:640px){ body{ background: radial-gradient(circle at 20% 10%, #E3E6DA 0%, var(--bg) 55%); } }
  #app{ width:100%; max-width:480px; min-height:100vh; position:relative; background:var(--bg); display:flex; flex-direction:column; }
  @media(min-width:640px){
    #app{ min-height:auto; margin:32px 0; border-radius:20px; border:1px solid var(--border); box-shadow:0 40px 80px -20px rgba(18,24,31,0.28); overflow:hidden; }
  }
  .view{display:none;}
  .view.active{display:flex; flex-direction:column; flex:1;}
  .view-enter{animation:viewIn .38s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes viewIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .pad{padding:28px 24px 40px;}
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px 4px; }
  .back-btn{ background:none; border:none; color:var(--muted); font-family:var(--font-body); font-size:15px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; padding:6px 4px; margin-left:-4px; }
  .back-btn:hover{color:var(--text);}
  .back-btn svg{width:16px;height:16px;}

  .home-top{padding:52px 28px 0;}
  .brand{ font-family:var(--font-display); font-weight:800; font-size:clamp(44px, 13vw, 66px); line-height:0.86; letter-spacing:-1px; color:var(--text); margin:0; }
  .brand span{color:var(--accent);}
  .tagline{ display:inline-block; font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:0.2px; color:var(--accent-2); margin:16px 0 0; padding-bottom:4px; border-bottom:2px solid var(--accent-2); }
  .lede{ color:var(--muted); font-size:15px; line-height:1.65; margin:20px 0 0; max-width:38ch; }
  .hero-icons{ display:flex; align-items:center; gap:18px; margin:28px 0 0; padding-top:22px; border-top:1px solid var(--border); }
  .hero-icons svg{ width:28px; height:28px; color:var(--accent); opacity:0.85; }
  .hero-icons .hi-plate{color:var(--text); opacity:0.75;}
  .hero-icons .hi-hand{color:var(--accent-2); opacity:0.9;}
  .hero-icons .hi-divider{ width:1px; height:20px; background:var(--border-strong); }

  .cta-primary{ display:block; width:100%; background:var(--accent-2); color:#FFFFFF; border:none; font-family:var(--font-body); font-weight:700; font-size:16px; letter-spacing:0.2px; padding:18px 20px; border-radius:10px; cursor:pointer; margin-top:36px; transition:transform .15s ease, background .15s ease; }
  .cta-primary:active{transform:scale(0.97);}
  .cta-primary:hover{background:var(--accent-2-dark);}
  .cta-primary:disabled{opacity:0.5; cursor:not-allowed;}
  .cta-secondary{ display:block; width:100%; background:transparent; color:var(--text); border:1px solid var(--border-strong); font-family:var(--font-body); font-weight:600; font-size:15px; padding:16px 20px; border-radius:10px; cursor:pointer; margin-top:12px; transition:transform .15s ease, border-color .15s ease; }
  .cta-secondary:active{transform:scale(0.97);}
  .cta-secondary:hover{border-color:var(--accent);}
  .quick-links{ display:flex; gap:10px; margin-top:14px; }
  .quick-link{ flex:1; text-align:center; background:var(--bg-elev); border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-weight:600; font-size:13.5px; padding:13px 8px; border-radius:9px; cursor:pointer; text-decoration:none; }
  .quick-link:hover{border-color:var(--accent);}

  .home-section{ padding:34px 28px 0; }
  .home-section-title{ font-family:var(--font-display); font-size:23px; font-weight:800; margin:0 0 14px; letter-spacing:-0.3px; }
  .testi-row{ display:flex; gap:12px; overflow-x:auto; margin:0 -28px; padding:2px 28px 8px; }
  .testi-row::-webkit-scrollbar{display:none;}
  .testi-card{ flex:0 0 auto; width:240px; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:18px 18px 16px; }
  .testi-quote{ font-family:var(--font-display); font-size:42px; font-weight:800; color:var(--accent-2); line-height:0.5; margin:0 0 10px; }
  .testi-text{ font-size:13.5px; color:var(--text); line-height:1.55; margin:0 0 12px; min-height:52px; }
  .testi-name{ font-size:12px; color:var(--muted); font-weight:600; padding-top:10px; border-top:1px solid var(--border); }
  .foto-row{ display:flex; gap:10px; overflow-x:auto; margin:0 -28px; padding:2px 28px 8px; }
  .foto-row::-webkit-scrollbar{display:none;}
  .foto-item{ flex:0 0 auto; width:140px; height:140px; border-radius:10px; overflow:hidden; background:var(--bg-elev-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted-2); }
  .foto-item img{width:100%; height:100%; object-fit:cover;}
  .foto-item svg{width:28px; height:28px;}

  .plans-row{ display:flex; gap:10px; overflow-x:auto; margin:0 -28px; padding:2px 28px 8px; }
  .plans-row::-webkit-scrollbar{display:none;}
  .plan-card{ flex:0 0 auto; width:180px; background:var(--bg-elev); border:1px solid var(--border); border-top:3px solid var(--accent-2); border-radius:8px; padding:18px 16px 16px; }
  .plan-card-count{ font-family:var(--font-display); font-size:32px; font-weight:800; line-height:1; margin:0; font-variant-numeric:tabular-nums; }
  .plan-card-count small{ display:block; font-family:var(--font-body); font-size:11px; font-weight:600; color:var(--muted); margin-top:3px; }
  .plan-card-name{ font-family:var(--font-display); font-size:18px; font-weight:700; margin:12px 0 6px; }
  .plan-card-desc{ font-size:12.5px; color:var(--muted); line-height:1.5; }

  .profesores-list{ display:flex; flex-direction:column; }
  .profesor-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .profesor-row:last-child{border-bottom:none;}
  .profesor-foto{ width:44px; height:44px; border-radius:50%; overflow:hidden; background:var(--bg-elev-2); flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--muted-2); }
  .profesor-foto img{width:100%; height:100%; object-fit:cover;}
  .profesor-foto svg{width:20px; height:20px;}
  .profesor-nombre{ flex:1; min-width:0; font-size:14.5px; font-weight:600; margin:0; }

  .info-block{ margin-top:20px; padding:24px 28px 22px; border-top:1px solid var(--border); }
  .info-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; color:var(--muted); padding:6px 0; }
  .info-row b{color:var(--text); font-weight:600;}
  .info-link{ display:flex; align-items:center; gap:10px; padding:10px 0; text-decoration:none; color:var(--text); border-bottom:1px solid var(--border); font-size:14px; font-weight:600; }
  .info-link svg{width:18px; height:18px; color:var(--accent);}
  .info-link:last-of-type{border-bottom:none;}
  .policy-note{ font-size:12.5px; color:var(--muted-2); line-height:1.6; margin-top:16px; }
  .admin-link{ display:inline-block; margin-top:18px; font-size:12.5px; color:var(--muted-2); text-decoration:none; cursor:pointer; border:none; background:none; font-family:var(--font-body); padding:0; }
  .admin-link:hover{color:var(--muted);}

  .section-eyebrow{ font-size:13px; color:var(--muted); font-weight:500; margin:0 0 4px; }
  .section-title{ font-family:var(--font-display); font-size:36px; font-weight:800; margin:0 0 22px; line-height:0.95; letter-spacing:-0.5px; }

  .plan-banner{ background:var(--accent-soft); border:1px solid rgba(36,57,140,0.22); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
  .plan-banner-plan{ font-size:12px; font-weight:700; color:var(--accent); letter-spacing:0.2px; margin:0 0 4px; }
  .plan-banner-msg{ font-size:13.5px; color:var(--text); line-height:1.45; margin:0; }
  .plan-banner.blocked{ background:var(--warn-soft); border-color:rgba(196,59,39,0.28); }
  .plan-banner.blocked .plan-banner-plan{color:var(--warn);}

  .day-chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; margin:0 -24px; padding-left:24px; padding-right:24px; }
  .day-chips::-webkit-scrollbar{display:none;}
  .day-chip{ flex:0 0 auto; background:var(--bg-elev); border:1px solid var(--border); color:var(--muted); font-family:var(--font-body); font-weight:600; font-size:13.5px; padding:12px 16px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:all .15s ease; text-align:center; }
  .day-chip small{display:block; font-weight:500; font-size:10.5px; opacity:0.75; margin-top:2px;}
  .day-chip.today{border-color:var(--accent-2); color:var(--accent-2);}
  .day-chip.active{ background:var(--accent); border-color:var(--accent); color:#FFFFFF; }

  .time-list{ display:flex; flex-direction:column; margin-top:20px; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .time-card{ position:relative; display:flex; align-items:center; justify-content:space-between; background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0; padding:16px 18px; cursor:pointer; transition:background .15s ease; }
  .time-card:last-child{border-bottom:none;}
  .time-card:hover{background:var(--bg-elev-2);}
  .time-card:active{transform:scale(0.99);}
  .time-card.selected{ background:var(--accent-soft); }
  .time-card.selected::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
  .time-card .hora{ font-family:var(--font-display); font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
  .time-card .cupos{ font-size:13px; font-weight:600; color:var(--ok); text-align:right; }
  .time-card .cupos small{display:block; font-weight:500; color:var(--muted-2); font-size:11px;}
  .time-card .cupos.low{color:var(--accent-2);}
  .time-card .cupos.full{color:var(--muted-2);}
  .time-card.cerrado{ cursor:not-allowed; opacity:0.45; }
  .time-card.cerrado:hover{background:transparent;}
  .empty-note{ color:var(--muted); font-size:14px; margin-top:20px; line-height:1.6; }

  .carrito-bar{ margin-top:20px; background:var(--accent-soft); border:1px solid rgba(36,57,140,0.22); border-radius:10px; padding:16px; }
  .carrito-bar-title{font-size:13px; font-weight:700; color:var(--accent); margin:0 0 10px;}
  .carrito-chip{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-elev); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px; }
  .carrito-chip button{ background:none; border:none; color:var(--warn); font-weight:700; cursor:pointer; padding:2px 6px; font-size:14px; }
  .carrito-hint{ font-size:12px; color:var(--muted); margin:8px 0 0; line-height:1.5; }

  .form-summary{ background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:24px; }
  .form-summary-item{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  .form-summary-item + .form-summary-item{border-top:1px solid var(--border);}
  .fs-day{font-size:13px; color:var(--muted); font-weight:500;}
  .fs-hora{font-family:var(--font-display); font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .form-identidad{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-elev-2); border-radius:10px; padding:12px 14px; margin-bottom:20px; font-size:13px; }
  .form-identidad b{display:block; font-size:14.5px;}

  .field{margin-bottom:16px;}
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:7px; font-weight:500; }
  .field input, .field select{ width:100%; background:var(--bg-elev); border:1px solid var(--border-strong); color:var(--text); font-family:var(--font-body); font-size:16px; padding:14px 15px; border-radius:9px; outline:none; transition:border-color .15s ease; }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .form-alert{ background:var(--warn-soft); border:1px solid rgba(196,59,39,0.28); color:var(--warn); font-size:13.5px; padding:12px 14px; border-radius:9px; margin-bottom:16px; display:none; }
  .form-note{ background:var(--accent-soft); border:1px solid rgba(36,57,140,0.22); color:var(--accent); font-size:13px; padding:12px 14px; border-radius:9px; margin-bottom:16px; line-height:1.5; }

  .amigo-row{ display:flex; gap:8px; margin-bottom:10px; }
  .amigo-row input{ background:var(--bg-elev); border:1px solid var(--border-strong); color:var(--text); border-radius:9px; padding:11px 12px; font-family:var(--font-body); font-size:14px; flex:1; min-width:0; }
  .amigo-row button{ background:var(--warn-soft); border:none; color:var(--warn); border-radius:9px; width:40px; flex:0 0 auto; cursor:pointer; }
  .add-amigo-btn{ width:100%; background:var(--bg-elev-2); border:1px dashed var(--border-strong); color:var(--muted); border-radius:9px; padding:12px; font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:6px; }
  .add-amigo-btn:hover{color:var(--text); border-color:var(--accent);}

  .confirm-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 30px; }
  .check-circle{ width:74px; height:74px; border-radius:50%; border:2px solid var(--ok); display:flex; align-items:center; justify-content:center; margin-bottom:26px; }
  .check-circle.wait{border-color:var(--accent-2);}
  .check-circle svg{width:34px; height:34px;}
  .check-circle path{ stroke:var(--ok); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:40; stroke-dashoffset:40; animation:draw .5s ease .15s forwards; }
  .check-circle.wait path{stroke:var(--accent-2);}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .confirm-title{ font-family:var(--font-display); font-size:32px; font-weight:800; margin:0 0 12px; letter-spacing:-0.3px; }
  .confirm-text{ color:var(--muted); font-size:15px; line-height:1.6; max-width:34ch; margin:0 0 18px; }
  .confirm-text b{color:var(--text);}
  .confirm-list{ text-align:left; width:100%; margin:0 0 26px; }
  .confirm-list div{ background:var(--bg-elev); border:1px solid var(--border); border-radius:9px; padding:11px 14px; margin-bottom:7px; font-size:13.5px; display:flex; justify-content:space-between; }
  .wa-btn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; background:#25D366; color:#0b2413; border:none; font-family:var(--font-body); font-weight:700; font-size:15.5px; padding:16px 20px; border-radius:10px; cursor:pointer; text-decoration:none; }
  .wa-btn svg{width:19px;height:19px;}

  .lookup-wrap{padding:8px 0;}
  .week-group{margin-bottom:22px;}
  .week-group-title{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0 0 10px; color:var(--accent-2); }
  .week-item{ background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:13px 16px; margin-bottom:8px; }
  .week-item-head{ display:flex; align-items:center; justify-content:space-between; }
  .week-item .wi-date{font-size:13.5px; font-weight:600;}
  .week-item .wi-hora{font-family:var(--font-display); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;}
  .week-item-actions{ display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .badge{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; }
  .badge-ok{background:var(--ok-soft); color:var(--ok);}
  .badge-pend{background:var(--accent-soft); color:var(--accent);}
  .badge-cancel{background:var(--warn-soft); color:var(--warn);}

  .pin-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 28px; }
  .pin-wrap .field input{text-align:center; letter-spacing:6px; font-size:22px;}

  .admin-tabs{ display:flex; gap:4px; background:var(--bg-elev); border:1px solid var(--border); border-radius:9px; padding:4px; margin-bottom:22px; overflow-x:auto; }
  .admin-tab{ flex:1; text-align:center; background:none; border:none; color:var(--muted); font-family:var(--font-body); font-weight:600; font-size:12.5px; padding:10px 6px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  .admin-tab.active{background:var(--accent); color:#FFFFFF;}

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .stat-card{ background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat-num{ font-family:var(--font-display); font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:12px; color:var(--muted); margin-top:6px; font-weight:500; }
  .stat-card.wide{grid-column:1/3;}
  .dash-block{margin-bottom:24px;}
  .dash-block-title{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0 0 10px; }
  .dash-row{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:8px; font-size:13.5px; }
  .dash-row b{font-weight:700;}

  .admin-day-group{margin-bottom:26px;}
  .admin-day-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .admin-day-title{ font-family:var(--font-display); font-size:20px; font-weight:700; margin:0; color:var(--accent-2); }
  .day-copy-row{display:flex; gap:6px; align-items:center;}
  .tiny-btn{ background:var(--bg-elev-2); border:1px solid var(--border-strong); color:var(--muted); border-radius:7px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:var(--font-body); white-space:nowrap; }
  .tiny-btn:hover{color:var(--text); border-color:var(--accent);}
  .tiny-btn.accent{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
  .copy-bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--accent-soft); border:1px solid rgba(36,57,140,0.22); border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; color:var(--accent); flex-wrap:wrap; }
  .copy-bar-actions{display:flex; gap:6px; flex-wrap:wrap;}

  .admin-slot{ background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:13px 15px; margin-bottom:8px; }
  .admin-slot-head{ display:flex; align-items:center; justify-content:space-between; }
  .admin-slot-hora{font-family:var(--font-display); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;}
  .admin-slot-count{font-size:12.5px; color:var(--muted); font-weight:500;}
  .admin-cupo-edit{ display:flex; align-items:center; gap:8px; }
  .admin-cupo-edit input{ width:48px; background:var(--bg-elev-2); border:1px solid var(--border-strong); color:var(--text); text-align:center; border-radius:7px; padding:6px 4px; font-family:var(--font-body); font-size:14px; }
  .icon-btn{ background:none; border:none; color:var(--muted-2); cursor:pointer; padding:6px; border-radius:7px; display:flex; align-items:center; text-decoration:none; }
  .icon-btn:hover{color:var(--warn); background:rgba(196,59,39,0.08);}
  .icon-btn svg{width:16px;height:16px;}

  .admin-alumnos{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .admin-alumno{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:6px 0; }
  .admin-alumno-name{font-weight:500;}
  .admin-alumno-tel{color:var(--muted); font-size:12px;}
  .admin-alumno-libre{color:var(--muted-2); font-size:12.5px; font-style:italic; margin:4px 0;}

  .waitlist-box{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-strong); }
  .waitlist-title{font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--accent-2); font-weight:700; margin:0 0 6px;}
  .waitlist-item{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:6px 0; gap:8px; }

function horarioDefault(){
  const base = [
    { hora:"08:00", cupoMax:3 }, { hora:"09:00", cupoMax:3 }, { hora:"10:00", cupoMax:3 },
    { hora:"18:00", cupoMax:3 }, { hora:"19:00", cupoMax:3 }, { hora:"20:00", cupoMax:3 },
  ];
  const schedule = {};
  DIAS.forEach(d=> schedule[d] = []);
  DIAS_ACTIVOS.forEach(d=>{ schedule[d] = base.map(b => ({ id: d+"__"+b.hora, hora:b.hora, cupoMax:b.cupoMax })); });
  return schedule;
}

/* ======================================================================
   FECHAS
   ====================================================================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function fechaKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseFechaKey(key){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }
function nombreDiaSemana(d){ return DIAS[d.getDay()]; }
function hoyKey(){ return fechaKey(new Date()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function labelFecha(d){ const abr=['dom','lun','mar','mié','jue','vie','sáb']; return { top: abr[d.getDay()], bot: pad2(d.getDate())+'/'+pad2(d.getMonth()+1) }; }
function formatFechaLarga(key){
  const d = parseFechaKey(key);
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${DIAS[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
}
function proximasFechas(n=14){
  const out=[]; let d = new Date();
  for(let i=0;i<n;i++){
    const dia = nombreDiaSemana(d);
    if((schedule[dia]||[]).length>0) out.push({ key: fechaKey(d), dia, dateObj:new Date(d) });
    d = addDays(d,1);
  }
  return out;
}
function slotCerrado(fecha, horaStr){
  const [y,m,dd] = fecha.split('-').map(Number);
  const [hh,mm] = horaStr.split(':').map(Number);
  const slotDate = new Date(y,m-1,dd,hh,mm);
  const limite = new Date(Date.now() + CONFIG.cierreAnticipacionHoras*3600*1000);
  return slotDate < limite;
}
function inicioSemana(d){ const r=new Date(d); const dow=r.getDay(); const diff = dow===0?-6:1-dow; r.setDate(r.getDate()+diff); r.setHours(0,0,0,0); return r; }

/* ======================================================================
   ESTADO Y ALMACENAMIENTO
   ====================================================================== */
let schedule = null;
let reservas = null;   // [{id,fecha,dia,horaId,hora,nombre,telefono,dni,estado,ts,grupoId,canceladaTs,asistio,asistioTs}]
let waitlist = null;   // [{id,fecha,dia,horaId,hora,nombre,telefono,dni,ts,estado}]
let perfiles = null;   // { dni: {nombre,telefono,dni,apodo,fechaNac,plan,clasesPersoPorSemana,grupoId,creado,actualizado} }
let comprobantes = [];   // [{id,dni,url,subidoPor,ts}]
let testimonios = [];    // [{id,dni,nombreMostrado,texto,ts}]
let grupos = [];         // [{id,nombre}]
let rutinaDias = [];     // [{id,dni,grupoId,nombreDia,orden}]
let rutinaEjercicios = []; // [{id,rutinaDiaId,nombre,series,repeticiones,peso,orden}]
let registros = [];      // [{id,dni,fecha,ejercicio,series,repeticiones,peso,esExtra,rutinaEjercicioId,ts}]

let state = {
  view:'home',
  identidad:null,              // {dni,nombre,telefono} — quién está reservando
  idDni:'', idNombre:'', idTel:'', idNecesitaDatos:false,
  carrito:[], fechaSel:null, slotSel:null, modoEspera:false, modoModificar:null, limiteMsg:'',
  amigos:[],
  buscarDni:'',
  isAdmin:false, adminTab:'dashboard', filtroAlumno:'',
  horariosCopiados:null,
  mostrarNuevoAlumno:false, naNombre:'', naTel:'', naDni:'', naPlan:'', naPerso:'',
  mostrarNuevoGrupo:false, ngNombre:'',
  adminAlumnoDni:null, adminAlumnoTab:'pagos',
  adminGrupoId:null,
  rutinaCopiada:null,
  testiDni:'', testiTexto:'', testiPerfil:undefined,
  registroFecha:'', registroDiaId:'', registroValores:{}, registroExtra:[],
};

// --- Conexión a Supabase (base de datos real de MOTUS ENTRENA) ---
const SUPABASE_URL = "https://iipyhuszlvjcjsncelpy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_836Sk4TLGC2NpCUQH7VZmA_fZ14Mhvg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadData(){
  const [h, r, w, p, cf, cp, ts, gr, rd, re, rg] = await Promise.all([
    sb.from('horarios').select('*'),
    sb.from('reservas').select('*'),
    sb.from('waitlist').select('*'),
    sb.from('perfiles').select('*'),
    sb.from('config_sitio').select('*').eq('id',1).maybeSingle(),
    sb.from('comprobantes').select('*'),
    sb.from('testimonios').select('*'),
    sb.from('grupos').select('*'),
    sb.from('rutina_dias').select('*'),
    sb.from('rutina_ejercicios').select('*'),
    sb.from('registros').select('*'),
  ]);
  [h,r,w,p,cf,cp,ts,gr,rd,re,rg].forEach(res=>{ if(res.error) console.error('Supabase error:', res.error); });

  schedule = {}; DIAS.forEach(d=> schedule[d]=[]);
  (h.data||[]).forEach(x=>{ if(!schedule[x.dia]) schedule[x.dia]=[]; schedule[x.dia].push({ id:x.id, hora:x.hora, cupoMax:x.cupo_max }); });
  if((h.data||[]).length===0){ schedule = horarioDefault(); await saveSchedule(); }

  reservas = (r.data||[]).map(x=>({ id:x.id, fecha:x.fecha, dia:x.dia, horaId:x.hora_id, hora:x.hora, nombre:x.nombre, telefono:x.telefono, dni:x.dni, estado:x.estado, ts:x.ts, grupoId:x.grupo_id, canceladaTs:x.cancelada_ts, asistio:x.asistio, asistioTs:x.asistio_ts }));
  waitlist = (w.data||[]).map(x=>({ id:x.id, fecha:x.fecha, dia:x.dia, horaId:x.hora_id, hora:x.hora, nombre:x.nombre, telefono:x.telefono, dni:x.dni, ts:x.ts, estado:x.estado }));
  perfiles = {};
  (p.data||[]).forEach(x=>{ perfiles[x.dni] = { nombre:x.nombre, telefono:x.telefono, dni:x.dni, apodo:x.apodo||'', fechaNac:x.fecha_nac||'', plan:x.plan||null, clasesPersoPorSemana: x.clases_perso_por_semana??null, grupoId:x.grupo_id||null, creado:x.creado, actualizado:x.actualizado }; });

  if(cf.data && cf.data.data){ Object.assign(CONFIG, cf.data.data); }
  else{ await sb.from('config_sitio').insert({ id:1, data: CONFIG }); }

  comprobantes = (cp.data||[]).map(x=>({ id:x.id, dni:x.dni, url:x.url, subidoPor:x.subido_por, ts:x.ts }));
  testimonios = (ts.data||[]).map(x=>({ id:x.id, dni:x.dni, nombreMostrado:x.nombre_mostrado, texto:x.texto, ts:x.ts }));
  grupos = (gr.data||[]).map(x=>({ id:x.id, nombre:x.nombre }));
  rutinaDias = (rd.data||[]).map(x=>({ id:x.id, dni:x.dni, grupoId:x.grupo_id, nombreDia:x.nombre_dia, orden:x.orden }));
  rutinaEjercicios = (re.data||[]).map(x=>({ id:x.id, rutinaDiaId:x.rutina_dia_id, nombre:x.nombre, series:x.series, repeticiones:x.repeticiones, peso:x.peso, orden:x.orden }));
  registros = (rg.data||[]).map(x=>({ id:x.id, dni:x.dni, fecha:x.fecha, ejercicio:x.ejercicio, series:x.series, repeticiones:x.repeticiones, peso:x.peso, esExtra:x.es_extra, rutinaEjercicioId:x.rutina_ejercicio_id, ts:x.ts }));
}

async function saveSchedule(idsABorrar){
  const rows = [];
  DIAS.forEach(dia => (schedule[dia]||[]).forEach(s => rows.push({ id:s.id, dia, hora:s.hora, cupo_max:s.cupoMax })));
  if(idsABorrar && idsABorrar.length){
    const del = await sb.from('horarios').delete().in('id', idsABorrar);
    if(del.error){ console.error('Error actualizando horarios:', del.error); alert('No se pudo guardar el horario: '+del.error.message); return false; }
  }
  if(rows.length){
    const ins = await sb.from('horarios').upsert(rows, { onConflict:'id' });
    if(ins.error){ console.error('Error guardando horarios:', ins.error); alert('No se pudo guardar el horario: '+ins.error.message); return false; }
  }
  return true;
}
async function saveReservas(){
  const rows = reservas.map(r=>({ id:r.id, fecha:r.fecha, dia:r.dia, hora_id:r.horaId, hora:r.hora, nombre:r.nombre, telefono:r.telefono, dni:r.dni, estado:r.estado, ts:r.ts, grupo_id:r.grupoId||null, cancelada_ts:r.canceladaTs||null, asistio: r.asistio===undefined?null:r.asistio, asistio_ts:r.asistioTs||null }));
  if(!rows.length) return true;
  const { error } = await sb.from('reservas').upsert(rows, { onConflict:'id' });
  if(error){ console.error('Error guardando reservas:', error); alert('No se pudo guardar la reserva: '+error.message); return false; }
  return true;
}
async function saveWaitlist(idsABorrar){
  const rows = waitlist.map(w=>({ id:w.id, fecha:w.fecha, dia:w.dia, hora_id:w.horaId, hora:w.hora, nombre:w.nombre, telefono:w.telefono, dni:w.dni, ts:w.ts, estado:w.estado }));
  if(idsABorrar && idsABorrar.length){
    const del = await sb.from('waitlist').delete().in('id', idsABorrar);
    if(del.error){ console.error('Error actualizando lista de espera:', del.error); alert('No se pudo actualizar la lista de espera: '+del.error.message); return false; }
  }
  if(rows.length){
    const ins = await sb.from('waitlist').upsert(rows, { onConflict:'id' });
    if(ins.error){ console.error('Error guardando lista de espera:', ins.error); alert('No se pudo guardar la lista de espera: '+ins.error.message); return false; }
  }
  return true;
}
async function savePerfiles(){
  const rows = Object.values(perfiles).map(p=>({ dni:p.dni, nombre:p.nombre, telefono:p.telefono, apodo:p.apodo||'', fecha_nac:p.fechaNac||null, plan:p.plan||null, clases_perso_por_semana: p.clasesPersoPorSemana??null, grupo_id:p.grupoId||null, creado: p.creado!==false, actualizado:p.actualizado||Date.now() }));
  if(!rows.length) return true;
  const { error } = await sb.from('perfiles').upsert(rows, { onConflict:'dni' });
  if(error){ console.error('Error guardando perfiles:', error); alert('No se pudo guardar el alumno: '+error.message); return false; }
  return true;
}
async function saveConfig(){
  const { error } = await sb.from('config_sitio').upsert({ id:1, data: CONFIG });
  if(error){ console.error('Error guardando configuración:', error); alert('No se pudo guardar el cambio: '+error.message); return false; }
  return true;
}

// --- Comprobantes de pago ---
async function subirComprobante(file, dni, subidoPor){
  const path = `${dni}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error } = await sb.storage.from('comprobantes').upload(path, file);
  if(error){ alert('No se pudo subir la imagen: '+error.message); return null; }
  const { data } = sb.storage.from('comprobantes').getPublicUrl(path);
  const row = { id:uid(), dni, url:data.publicUrl, subido_por:subidoPor, ts:Date.now() };
  await sb.from('comprobantes').insert(row);
  comprobantes.push({ id:row.id, dni, url:row.url, subidoPor, ts:row.ts });
  return row;
}
function comprobantesDe(dni){ return comprobantes.filter(c=>c.dni===dni).sort((a,b)=>b.ts-a.ts); }

// --- Fotos de portada ---
async function subirFotoPortada(file){
  const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error } = await sb.storage.from('portada').upload(path, file);
  if(error){ alert('No se pudo subir la imagen: '+error.message); return; }
  const { data } = sb.storage.from('portada').getPublicUrl(path);
  CONFIG.fotos.push(data.publicUrl);
  await saveConfig();
}

// --- Profesores ---
async function subirFotoProfesor(file, profesorId){
  const path = `profesores/${profesorId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error } = await sb.storage.from('portada').upload(path, file);
  if(error){ alert('No se pudo subir la imagen: '+error.message); return; }
  const { data } = sb.storage.from('portada').getPublicUrl(path);
  const prof = CONFIG.profesores.find(p=>p.id===profesorId);
  if(prof) prof.foto = data.publicUrl;
  await saveConfig();
}

// --- Testimonios ---
async function agregarTestimonio(dni, nombreMostrado, texto){
  const row = { id:uid(), dni, nombre_mostrado:nombreMostrado, texto, ts:Date.now() };
  await sb.from('testimonios').insert(row);
  testimonios.push({ id:row.id, dni, nombreMostrado, texto, ts:row.ts });
}
async function borrarTestimonio(id){
  await sb.from('testimonios').delete().eq('id', id);
  testimonios = testimonios.filter(t=>t.id!==id);
}

// --- Grupos ---
async function crearGrupo(nombre){
  const row = { id:uid(), nombre };
  await sb.from('grupos').insert(row);
  grupos.push(row);
  return row;
}
async function borrarGrupo(id){
  await sb.from('grupos').delete().eq('id', id);
  const diasDelGrupo = rutinaDias.filter(d=>d.grupoId===id).map(d=>d.id);
  if(diasDelGrupo.length){
    await sb.from('rutina_ejercicios').delete().in('rutina_dia_id', diasDelGrupo);
    await sb.from('rutina_dias').delete().eq('grupo_id', id);
  }
  Object.values(perfiles).forEach(p=>{ if(p.grupoId===id) p.grupoId=null; });
  await savePerfiles();
  grupos = grupos.filter(g=>g.id!==id);
  rutinaDias = rutinaDias.filter(d=>d.grupoId!==id);
  rutinaEjercicios = rutinaEjercicios.filter(e=> !diasDelGrupo.includes(e.rutinaDiaId));
}

// --- Rutinas ---
function rutinaDiasDe(dni){
  const perfil = perfiles[dni];
  const propios = rutinaDias.filter(d=>d.dni===dni);
  const delGrupo = perfil && perfil.grupoId ? rutinaDias.filter(d=>d.grupoId===perfil.grupoId) : [];
  return [...propios, ...delGrupo].sort((a,b)=> a.orden-b.orden);
}
function ejerciciosDe(rutinaDiaId){ return rutinaEjercicios.filter(e=>e.rutinaDiaId===rutinaDiaId).sort((a,b)=>a.orden-b.orden); }
async function crearRutinaDia(target, nombreDia){
  const existentes = target.dni ? rutinaDias.filter(d=>d.dni===target.dni) : rutinaDias.filter(d=>d.grupoId===target.grupoId);
  const orden = existentes.length;
  const row = { id:uid(), dni: target.dni||null, grupo_id: target.grupoId||null, nombre_dia:nombreDia, orden };

function cuposOcupados(fecha, horaId){ return reservas.filter(r=>r.fecha===fecha && r.horaId===horaId && r.estado!=='cancelada').length; }
function cuposLibres(fecha, slot){ return slot.cupoMax - cuposOcupados(fecha, slot.id); }
function esperaDe(fecha, horaId){ return waitlist.filter(w=>w.fecha===fecha && w.horaId===horaId && w.estado==='esperando'); }
function ofrecidaDe(fecha, horaId){ return waitlist.filter(w=>w.fecha===fecha && w.horaId===horaId && w.estado==='ofrecida'); }
function getSlot(dia, id){ if(!dia || !schedule[dia]) return null; return schedule[dia].find(s=>s.id===id) || null; }

function normalizarDni(raw){ return (raw||'').replace(/\D/g,''); }
function toWaNumber(raw){
  let d = (raw||'').replace(/\D/g,'');
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('0')) d = d.slice(1);
  d = d.replace(/^(\d{2,4})15(\d+)$/, '$1$2');
  if(d.startsWith('549')) return d;
  if(d.startsWith('54')) return '549'+d.slice(2);
  return '549'+d;
}
function waLink(telefono, mensaje){ return `https://wa.me/${toWaNumber(telefono)}?text=${encodeURIComponent(mensaje)}`; }

function nombrePreferido(nombreCompleto, apodo){
  if(apodo && apodo.trim()) return apodo.trim();
  return (nombreCompleto||'').trim().split(/\s+/)[0] || nombreCompleto || '';
}
function nombreSaludo(nombreCompleto, dni){ const p = dni && perfiles[dni]; return nombrePreferido(nombreCompleto, p && p.apodo); }
function mensajeRecordatorio(nombreCompleto, dni){ return `¡Hola ${nombreSaludo(nombreCompleto,dni)}! Te escribimos de ${CONFIG.nombreEspacio} para recordarte que reserves tu próximo entrenamiento 💪. Cualquier consulta, avisanos por acá.`; }
function mensajeCancelacion(nombreCompleto, dni, fecha, hora){ return `Hola ${nombreSaludo(nombreCompleto,dni)}! Te escribimos de ${CONFIG.nombreEspacio} para avisarte que tuvimos que cancelar tu turno del ${formatFechaLarga(fecha)} a las ${hora}. Cualquier consulta o para reprogramar, contanos por acá.`; }
function mensajeOfertaEspera(nombreCompleto, dni, fecha, hora){ return `¡Hola ${nombreSaludo(nombreCompleto,dni)}! Se liberó un lugar el ${formatFechaLarga(fecha)} a las ${hora} en ${CONFIG.nombreEspacio} y sos el/la siguiente en la lista de espera. ¿Confirmás que lo tomás? Respondé por acá y te lo reservamos.`; }
function mensajeCumple(perfil){ return `¡Feliz cumpleaños, ${nombrePreferido(perfil.nombre, perfil.apodo)}! 🎉 Todo el equipo de ${CONFIG.nombreEspacio} te desea un gran día. ¡Nos vemos en el próximo entrenamiento!`; }
function mensajeContactoProfesor(nombreProfesor){ return `¡Hola ${(nombreProfesor||'').trim().split(/\s+/)[0]}! Te escribo desde la web de ${CONFIG.nombreEspacio}.`; }

async function upsertPerfil(nombre, telefono, dni){
  const key = normalizarDni(dni);
  const existente = perfiles[key] || {};
  perfiles[key] = {
    nombre: nombre.trim(), telefono: telefono.trim(), dni: key,
    apodo: existente.apodo || '', fechaNac: existente.fechaNac || '',
    plan: existente.plan || null, clasesPersoPorSemana: existente.clasesPersoPorSemana || null,
    creado:true, actualizado: Date.now(),
  };
  await savePerfiles();
  return perfiles[key];
}

// --- Planes y límite semanal ---
function limiteSemanal(perfil){
  if(!perfil || !perfil.plan) return Infinity;
  if(perfil.plan==='perso') return perfil.clasesPersoPorSemana==null ? Infinity : perfil.clasesPersoPorSemana;
  return CONFIG.planes[perfil.plan] ? CONFIG.planes[perfil.plan].clasesPorSemana : Infinity;
}
function nombrePlan(perfil){
  if(!perfil || !perfil.plan) return null;
  return CONFIG.planes[perfil.plan] ? CONFIG.planes[perfil.plan].nombre : perfil.plan;
}
function reservasEnSemanaDe(dni, fechaRef, excludeId){
  const inicio = fechaKey(inicioSemana(parseFechaKey(fechaRef)));
  const fin = fechaKey(addDays(inicioSemana(parseFechaKey(fechaRef)),6));
  return reservas.filter(r=> r.dni===dni && r.estado!=='cancelada' && r.fecha>=inicio && r.fecha<=fin && r.id!==excludeId).length;
}
function mensajePlanEstado(perfil, fechaRef, excludeId){
  if(!perfil || !perfil.plan){
    return { texto:'Todavía no tenés un plan asignado — tu profesor te lo va a asignar pronto. Por ahora podés reservar sin límite.', bloqueado:false, plan:null };
  }
  const limite = limiteSemanal(perfil);
  if(limite===Infinity || limite==null){
    return { texto:`Plan ${nombrePlan(perfil)} — tu profesor todavía no definió cuántas clases tenés esta semana.`, bloqueado:false, plan:nombrePlan(perfil) };
  }
  const usadas = reservasEnSemanaDe(perfil.dni, fechaRef, excludeId);
  const restantes = limite - usadas;
  let texto;
  if(usadas===0) texto = `Tenés disponibles tus ${limite} clases para esta semana.`;
  else if(restantes>0) texto = `Reservaste ${usadas} de tus ${limite} clases de esta semana. Te quedan ${restantes} disponibles.`;
  else texto = `Ya reservaste tus ${limite} clases de esta semana según tu plan.`;
  return { texto, bloqueado: restantes<=0, plan:nombrePlan(perfil), limite, usadas, restantes };
}

function calcularStats(){
  const hoy = new Date();
  const inicioSem = fechaKey(inicioSemana(hoy));
  const finSem = fechaKey(addDays(inicioSemana(hoy),5));
  const activas = reservas.filter(r=>r.estado!=='cancelada');
  const entrenamientosSemana = activas.filter(r=> r.fecha>=inicioSem && r.fecha<=finSem).length;

  let capacidadSemana = 0;
  DIAS_ACTIVOS.forEach(dia=> (schedule[dia]||[]).forEach(s=> capacidadSemana += s.cupoMax));
  const ocupacion = capacidadSemana>0 ? Math.round((entrenamientosSemana/capacidadSemana)*100) : 0;

  const hace30 = fechaKey(addDays(hoy,-30));
  const alumnosActivos = new Set(activas.filter(r=> r.fecha>=hace30).map(r=>r.telefono)).size;

  const canceladas = reservas.filter(r=>r.estado==='cancelada').length;
  const totalHist = reservas.length;
  const tasaCancel = totalHist>0 ? Math.round((canceladas/totalHist)*100) : 0;

  const porHora = {};
  activas.forEach(r=>{ porHora[r.hora] = (porHora[r.hora]||0)+1; });
  const picos = Object.entries(porHora).sort((a,b)=>b[1]-a[1]).slice(0,3);

  return { entrenamientosSemana, ocupacion, alumnosActivos, canceladas, tasaCancel, picos, capacidadSemana };
}
function huecosLibres(n=8){
  const out=[];
  proximasFechas(14).forEach(f=>{
    (schedule[f.dia]||[]).slice().sort((a,b)=>a.hora.localeCompare(b.hora)).forEach(s=>{
      if(slotCerrado(f.key, s.hora)) return;
      const libres = cuposLibres(f.key, s);
      if(libres>0) out.push({ fecha:f.key, dia:f.dia, hora:s.hora, libres, max:s.cupoMax });
    });
  });
  return out.slice(0,n);
}
function proximaFechaCumple(mes, dia, anio){
  const fecha = new Date(anio, mes-1, dia);
  if(fecha.getMonth()!==mes-1) return new Date(anio, mes-1, 28); // 29/2 en año no bisiesto -> 28/2
  return fecha;
}
function cumpleaniosProximos(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const out = [];
  Object.values(perfiles).forEach(p=>{
    if(!p.fechaNac) return;
    const [, m, d] = p.fechaNac.split('-').map(Number);
    let prox = proximaFechaCumple(m, d, hoy.getFullYear());
    if(prox < hoy) prox = proximaFechaCumple(m, d, hoy.getFullYear()+1);
    const dias = Math.round((prox-hoy)/86400000);
    if(dias<=7) out.push({ nombre:p.nombre, telefono:p.telefono, dni:p.dni, apodo:p.apodo, dias, fecha:prox });
  });
  return out.sort((a,b)=>a.dias-b.dias);
}

          <div class="time-card ${cerrado?'cerrado':''} ${enCarrito?'selected':''}" data-slot="${s.id}" data-full="${full}" data-cerrado="${cerrado}">
            <span class="hora">${s.hora}</span>
            ${cuposTxt}
          </div>`;
      }).join('') + `</div>`;
    }
  }

  let carritoHtml = '';
  if(state.carrito.length>0 && !state.modoModificar){
    carritoHtml = `
      <div class="carrito-bar">
        <p class="carrito-bar-title">Turnos seleccionados (${state.carrito.length})</p>
        ${state.carrito.map((c,i)=>`
          <div class="carrito-chip"><span>${formatFechaLarga(c.fecha)} · ${c.hora}</span><button type="button" class="btn-quitar-carrito" data-idx="${i}">✕</button></div>`).join('')}
        <p class="carrito-hint">¿Querés reservar otro día también? Elegí otra fecha arriba y sumala. Si ya está, continuá con tus datos.</p>
        <button class="cta-primary" id="btnContinuarCarrito" style="margin-top:10px;">Continuar con mis datos</button>
      </div>
    `;
  }

  return `
    <div class="topbar"><button class="back-btn" id="btnBack" data-to="home">${icon('back')} Inicio</button></div>
    <div class="pad">
      <p class="section-eyebrow">${state.modoModificar ? 'Elegí el nuevo horario' : `Hola, ${nombreSaludo(state.identidad.nombre, state.identidad.dni)}`}</p>
      <h2 class="section-title">Elegí un día</h2>
      <div class="day-chips">${chips}</div>
      ${banner}
      ${lista}
      ${carritoHtml}
    </div>
  `;
}

function renderProgresoLista(dni){
  const mios = registrosDe(dni);
  if(mios.length===0) return `<p class="empty-note">Todavía no hay entrenamientos registrados.</p>`;
  const porFecha = {};
  mios.forEach(r=>{ (porFecha[r.fecha] = porFecha[r.fecha]||[]).push(r); });
  return Object.keys(porFecha).sort((a,b)=>b.localeCompare(a)).map(fecha=>`
    <div class="progreso-day">
      <p class="wi-date" style="margin:0 0 8px;">${formatFechaLarga(fecha)}</p>
      ${porFecha[fecha].map(r=>{
        let badge;
        if(r.esExtra) badge = `<span class="cumplio-badge extra">Extra</span>`;
        else{
          const plan = rutinaEjercicios.find(e=>e.id===r.rutinaEjercicioId);
          if(!plan) badge = `<span class="cumplio-badge neutro">Sin referencia</span>`;
          else{
            const cumplio = (r.series||0)>=(plan.series||0) && (r.repeticiones||0)>=(plan.repeticiones||0);
            badge = cumplio ? `<span class="cumplio-badge si">Cumplió</span>` : `<span class="cumplio-badge no">Parcial</span>`;
          }
        }
        return `<div class="progreso-ex"><span>${escapeHtml(r.ejercicio)} — ${r.series||'-'}x${r.repeticiones||'-'}${r.peso?' · '+r.peso+'kg':''}</span>${badge}</div>`;
      }).join('')}
    </div>
  `).join('');
}

    const futuros = mias.filter(r=>r.fecha>=hoy);

    let plan = '';
    let saludo = '';
    let btnReservarOtra = '';
    if(perfil){
      saludo = `<p class="section-eyebrow" style="margin-bottom:14px;">¡Hola, ${escapeHtml(nombreSaludo(perfil.nombre, perfil.dni))}!</p>`;
      const estado = mensajePlanEstado(perfil, hoyKey());
      plan = `<div class="plan-banner ${estado.bloqueado?'blocked':''}"><p class="plan-banner-plan">${estado.plan || 'Sin plan asignado'}</p><p class="plan-banner-msg">${estado.texto}</p></div>`;

    if(mias.length===0){

      contenido = saludo + plan + btnReservarOtra + `
        ${futuros.length>0 ? `
          <div class="week-group" style="margin-top:20px;">
            <h3 class="week-group-title">Próximos turnos</h3>
            ${futuros.map(r=>`
              <div class="week-item" data-id="${r.id}">
                <div class="week-item-head">

                  <button class="mini-btn warn btn-cancelar-propia" data-id="${r.id}" style="flex:1;">Cancelar</button>
                </div>
              </div>`).join('')}
          </div>` : ''}

          <div class="week-group">
            <h3 class="week-group-title">Entrenamientos realizados</h3>
            ${pasados.slice().reverse().map(r=>`
              <div class="week-item">
                <div class="week-item-head">
                  <span><span class="wi-date">${formatFechaLarga(r.fecha)}</span><br><span class="wi-hora">${r.hora}</span></span>
                  <span class="badge ${r.asistio===true?'badge-ok':r.asistio===false?'badge-cancel':'badge-pend'}">${r.asistio===true?'Asistió':r.asistio===false?'No asistió':'Sin confirmar'}</span>

    if(perfil){

        <div class="week-group">

      <div class="stat-card"><div class="stat-num">${stats.ocupacion}%</div><div class="stat-label">Ocupación semanal</div></div>
      <div class="stat-card"><div class="stat-num">${stats.alumnosActivos}</div><div class="stat-label">Alumnos activos (30 días)</div></div>
      <div class="stat-card"><div class="stat-num">${stats.tasaCancel}%</div><div class="stat-label">Tasa de cancelación</div></div>
      <div class="stat-card wide">
        <div class="stat-label" style="margin-bottom:8px;">Horarios pico</div>
        ${stats.picos.length===0 ? `<span style="font-size:13px; color:var(--muted);">Todavía sin datos suficientes</span>` :
          stats.picos.map(([h,c])=>`<span style="display:inline-block; margin-right:14px; font-weight:700;">${h} <span style="color:var(--muted); font-weight:500;">(${c})</span></span>`).join('')}
      </div>
    </div>
    ${cumples.length>0 ? `
      <div class="dash-block">
        <h3 class="dash-block-title">🎂 Cumpleaños próximos</h3>

          <div class="dash-row">

function renderAdminAgenda(){
  const fechas = proximasFechas(14);
  if(fechas.length===0) return `<div class="empty-state">No hay horarios cargados.</div>`;
  return fechas.map(f=>{
    const slots = (schedule[f.dia]||[]).slice().sort((a,b)=>a.hora.localeCompare(b.hora));
    if(slots.length===0) return '';
    return `
      <div class="admin-day-group">
        <h3 class="admin-day-title">${formatFechaLarga(f.key)}</h3>
        ${slots.map(s=>{
          const alumnos = reservas.filter(r=>r.fecha===f.key && r.horaId===s.id && r.estado!=='cancelada');
          const espera = esperaDe(f.key, s.id);
          const ofrecidas = ofrecidaDe(f.key, s.id);
          const libres = s.cupoMax - alumnos.length;
          return `
            <div class="admin-slot">
              <div class="admin-slot-head"><span class="admin-slot-hora">${s.hora}</span><span class="admin-slot-count">${alumnos.length}/${s.cupoMax} cupos</span></div>
              <div class="admin-alumnos">
                ${alumnos.length===0 ? `<p class="admin-alumno-libre">Sin reservas para este horario</p>` : alumnos.map(a=>{
                  const apodo = a.dni && perfiles[a.dni] ? perfiles[a.dni].apodo : '';
                  const asistCtrl = a.asistio===true
                    ? `<button class="mini-btn ok btn-asistencia" data-id="${a.id}" data-valor="null">✓ Asistió</button>`
                    : a.asistio===false
                      ? `<button class="mini-btn warn btn-asistencia" data-id="${a.id}" data-valor="null">✗ Ausente</button>`
                      : `<span style="display:flex; gap:4px;">
                          <button class="mini-btn ok btn-asistencia" data-id="${a.id}" data-valor="true">Asistió</button>
                          <button class="mini-btn warn btn-asistencia" data-id="${a.id}" data-valor="false">Ausente</button>
                        </span>`;
                  return `
                  <div class="admin-alumno" data-reserva="${a.id}" style="flex-direction:column; align-items:stretch; gap:6px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                      <span><span class="admin-alumno-name">${escapeHtml(a.nombre)}${apodo?' ('+escapeHtml(apodo)+')':''}</span><br><span class="admin-alumno-tel">${escapeHtml(a.telefono)}</span></span>
                      <span style="display:flex; gap:2px;">
                        <a class="icon-btn" href="${waLink(a.telefono, `Hola ${nombreSaludo(a.nombre,a.dni)}! Te escribimos de ${CONFIG.nombreEspacio}.`)}" target="_blank" rel="noopener" title="Escribir por WhatsApp">${icon('wa')}</a>
                        <button class="icon-btn btn-cancel-reserva" data-id="${a.id}" data-fecha="${f.key}" data-hora="${s.hora}" data-nombre="${escapeHtml(a.nombre)}" data-tel="${escapeHtml(a.telefono)}" data-dni="${a.dni||''}" title="Cancelar reserva">${icon('trash')}</button>
                      </span>
                    </div>
                    <div>${asistCtrl}</div>
                  </div>`;
                }).join('')}
              </div>
              ${(espera.length>0 || ofrecidas.length>0) ? `
                <div class="waitlist-box">
                  <p class="waitlist-title">Lista de espera (${espera.length+ofrecidas.length})</p>
                  ${ofrecidas.map(w=>`
                    <div class="waitlist-item">
                      <span>${escapeHtml(w.nombre)} · <span style="color:var(--accent-2); font-weight:600;">oferta enviada</span></span>
                      <span class="waitlist-actions">
                        <button class="mini-btn ok btn-confirmar-espera" data-id="${w.id}">Confirmar</button>
                        <button class="mini-btn warn btn-descartar-espera" data-id="${w.id}">Descartar</button>
                      </span>
                    </div>`).join('')}
                  ${espera.map(w=>`
                    <div class="waitlist-item">
                      <span>${escapeHtml(w.nombre)}</span>
                      <span class="waitlist-actions">${libres>0 ? `<button class="mini-btn btn-ofrecer-espera" data-id="${w.id}">Ofrecer lugar</button>` : `<span style="color:var(--muted-2); font-size:11.5px;">sin cupo</span>`}</span>

}

function renderAdminHorarios(){

  const copyBar = copia ? `

        <button class="tiny-btn" id="btnDescartarCopia">Descartar</button>

        </div>

              <span class="admin-slot-hora">${s.hora}</span>

                <button class="icon-btn btn-del-slot" data-dia="${dia}" data-id="${s.id}" title="Eliminar horario">${icon('trash')}</button>

function renderRutinaEditor(target){
  const dias = target.dni ? rutinaDias.filter(d=>d.dni===target.dni) : rutinaDias.filter(d=>d.grupoId===target.grupoId);
  const copia = state.rutinaCopiada;

  let grupoReadOnlyHtml = '';
  if(target.dni){
    const perfilAlumno = perfiles[target.dni];
    if(perfilAlumno && perfilAlumno.grupoId){
      const grupo = grupos.find(g=>g.id===perfilAlumno.grupoId);
      const diasGrupo = rutinaDias.filter(d=>d.grupoId===perfilAlumno.grupoId).sort((a,b)=>a.orden-b.orden);
      if(diasGrupo.length>0){
        grupoReadOnlyHtml = `
          <p class="waitlist-title" style="margin-bottom:8px;">Rutina compartida del grupo "${escapeHtml(grupo?grupo.nombre:'')}" — se edita desde Grupos</p>
          ${diasGrupo.map(d=>`
            <div class="rutina-dia" style="opacity:0.85;">
              <div class="rutina-dia-head"><span class="admin-slot-hora" style="font-size:15px;">${escapeHtml(d.nombreDia)}</span></div>
              ${ejerciciosDe(d.id).map(e=>`<div class="ejercicio-row"><span style="flex:1; font-size:12.5px;">${escapeHtml(e.nombre)} — ${e.series||'-'}x${e.repeticiones||'-'}${e.peso?' · '+e.peso+'kg':''}</span></div>`).join('')}
            </div>
          `).join('')}
          <p class="waitlist-title" style="margin:14px 0 8px;">Rutina individual (editable acá)</p>
        `;
      }
    }
  }

  return grupoReadOnlyHtml + `
    ${copia ? `
      <div class="copy-bar">
        <span>📋 Copiaste "${escapeHtml(copia.nombreDia)}" (${copia.ejercicios.length} ejercicios)</span>
        <div class="copy-bar-actions">
          <button class="tiny-btn accent btn-pegar-rutina-dia">Pegar acá</button>
          <button class="tiny-btn" id="btnDescartarCopiaRutina">Descartar</button>
        </div>
      </div>` : ''}
    ${dias.length===0 ? `<p class="empty-note">Todavía no hay rutina cargada.</p>` : dias.sort((a,b)=>a.orden-b.orden).map(d=>{
      const ejercicios = ejerciciosDe(d.id);
      return `
        <div class="rutina-dia">
          <div class="rutina-dia-head">
            <span class="admin-slot-hora" style="font-size:16px;">${escapeHtml(d.nombreDia)}</span>
            <span style="display:flex; gap:4px;">
              <button class="tiny-btn btn-copiar-rutina-dia" data-id="${d.id}" data-nombre="${escapeHtml(d.nombreDia)}">Copiar</button>
              <button class="icon-btn btn-borrar-rutina-dia" data-id="${d.id}" title="Eliminar día">${icon('trash')}</button>
            </span>
          </div>
          ${ejercicios.map(e=>`
            <div class="ejercicio-row" data-id="${e.id}">
              <span style="flex:2; min-width:100px; font-size:12.5px;">${escapeHtml(e.nombre)}</span>
              <span style="font-size:12px; color:var(--muted);">${e.series||'-'}x${e.repeticiones||'-'}${e.peso?' · '+e.peso+'kg':''}</span>
              <button class="icon-btn btn-borrar-ejercicio" data-id="${e.id}" title="Eliminar">${icon('trash')}</button>
            </div>
          `).join('')}
          <div class="ejercicio-row">
            <input type="text" class="ej-nombre" placeholder="Ejercicio" id="ejNombre_${d.id}">
            <input type="number" min="0" class="ej-num" placeholder="Series" id="ejSeries_${d.id}">
            <input type="number" min="0" class="ej-num" placeholder="Reps" id="ejReps_${d.id}">
            <input type="number" min="0" step="0.5" class="ej-num" placeholder="Kg" id="ejPeso_${d.id}">
            <button class="tiny-btn btn-agregar-ejercicio" data-id="${d.id}">+ Agregar</button>
          </div>
        </div>
      `;
    }).join('')}

      <input type="text" id="nuevoDiaNombre" placeholder="Nombre del día (ej: Día 1 - Pecho)" style="flex:1; background:var(--bg-elev); border:1px solid var(--border-strong); border-radius:10px; padding:11px 12px; font-family:var(--font-body); font-size:13.5px; color:var(--text);">
      <button class="add-slot-btn btn-agregar-dia" style="flex:0 0 auto;">+ Agregar día</button>
    </div>
  `;
}

function renderAdminAlumnoFicha(){
  const dni = state.adminAlumnoDni;

  if(!a) return `<div class="empty-state">Alumno no encontrado.</div>`;
  const tabs = [['pagos','Pagos'],['rutina','Rutina'],['progreso','Progreso']];
  const tabsHtml = `<div class="admin-tabs">${tabs.map(([id,label])=>`<button class="admin-tab ${state.adminAlumnoTab===id?'active':''}" data-atab="${id}">${label}</button>`).join('')}</div>`;
  let body='';
  if(state.adminAlumnoTab==='pagos') body = renderComprobantesLista(dni,'entrenador');

  return `

      <p class="section-eyebrow">Ficha del alumno</p>

      ${body}
    </div>
  `;
}
