      <div class="field" style="margin-top:8px; margin-bottom:0;"><input type="file" class="inp-foto-profesor" data-id="${p.id}" accept="image/*"></div>
    </div>
  `).join('');

  return `
    <div class="dash-block">
      <h3 class="dash-block-title">Datos generales</h3>
      <div class="field"><label>Nombre del espacio</label><input type="text" class="portada-field" data-campo="nombreEspacio" value="${escapeHtml(CONFIG.nombreEspacio)}"></div>
      <div class="field"><label>Frase</label><input type="text" class="portada-field" data-campo="frase" value="${escapeHtml(CONFIG.frase)}"></div>
      <div class="field"><label>Descripción</label><input type="text" class="portada-field" data-campo="descripcion" value="${escapeHtml(CONFIG.descripcion)}"></div>
      <div class="field"><label>Instagram</label><input type="text" class="portada-field" data-campo="instagram" value="${escapeHtml(CONFIG.instagram)}"></div>
      <div class="field"><label>WhatsApp (sin + ni espacios)</label><input type="text" class="portada-field" data-campo="whatsapp" value="${escapeHtml(CONFIG.whatsapp)}"></div>
      <div class="field"><label>Dirección</label><input type="text" class="portada-field" data-campo="direccion" value="${escapeHtml(CONFIG.direccion)}"></div>
      <div class="field"><label>Política de cancelación</label><input type="text" class="portada-field" data-campo="politicaCancelacion" value="${escapeHtml(CONFIG.politicaCancelacion)}"></div>
    </div>
    <div class="dash-block">
      <h3 class="dash-block-title">Profesores</h3>
      ${profesoresHtml}
      <button class="add-slot-btn btn-agregar-profesor">+ Agregar profesor</button>
    </div>
    <div class="dash-block">
      <h3 class="dash-block-title">Fotos del espacio</h3>
      <div class="foto-row" style="flex-wrap:wrap;">${fotos}</div>
      <div class="field" style="margin-top:10px;"><label>Agregar foto</label><input type="file" id="inpNuevaFoto" accept="image/*"></div>
    </div>
    <div class="dash-block">
      <h3 class="dash-block-title">Planes</h3>
      ${opcionesPlan.map(([id,p])=>`
        <div class="admin-slot">
          <div class="alumno-edit-row" style="margin-top:0;">
            <div class="alumno-edit-col"><span class="alumno-edit-label">Nombre</span><input type="text" class="plan-field" data-plan="${id}" data-campo="nombre" value="${escapeHtml(p.nombre)}"></div>
            <div class="alumno-edit-col"><span class="alumno-edit-label">Clases/semana</span><input type="number" min="0" class="plan-field" data-plan="${id}" data-campo="clasesPorSemana" value="${p.clasesPorSemana==null?'':p.clasesPorSemana}" placeholder="${id==='perso'?'lo define el profe':''}"></div>
          </div>
          <div class="field" style="margin-top:8px; margin-bottom:0;"><input type="text" class="plan-field" data-plan="${id}" data-campo="desc" value="${escapeHtml(p.desc)}"></div>
        </div>
      `).join('')}
    </div>
    <p class="empty-note">Todos los cambios se guardan solos al salir de cada campo.</p>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str==null?'':str;
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ======================================================================
   EVENTOS
   ====================================================================== */
function bindEvents(){
  const $ = sel => app.querySelector(sel);
  const $$ = sel => Array.from(app.querySelectorAll(sel));

  const back = $('#btnBack');
  if(back) back.onclick = ()=>{
    if(state.modoModificar){ state.modoModificar=null; state.view='miSemana'; render(); return; }
    if(state.view==='adminAlumno' || state.view==='adminGrupo'){ state.view='admin'; state.adminTab='alumnos'; render(); return; }
    state.view = back.dataset.to; render();
  };

  if(state.view==='home'){
    $('#btnReservar').onclick = ()=>{
      state.identidad=null; state.idDni=''; state.idNombre=''; state.idTel=''; state.idNecesitaDatos=false;
      state.fechaSel=null; state.slotSel=null; state.modoEspera=false; state.modoModificar=null;
      state.carrito=[]; state.amigos=[]; state.limiteMsg='';
      state.view='identificar'; render();
    };
    $('#btnMiSemana').onclick = ()=>{ state.view='miSemana'; render(); };
    $('#btnAdmin').onclick = ()=>{ state.view='adminPin'; render(); };
    $('#btnDejarTestimonio').onclick = ()=>{ state.testiDni=''; state.testiTexto=''; state.testiPerfil=undefined; state.view='testimonio'; render(); };
  }

  if(state.view==='identificar'){
    $('#inpIdDni').oninput = e=>{ state.idDni = e.target.value; };
    const nombreEl = $('#inpIdNombre'); if(nombreEl) nombreEl.oninput = e=>{ state.idNombre = e.target.value; };
    const telEl = $('#inpIdTel'); if(telEl) telEl.oninput = e=>{ state.idTel = e.target.value; };
    const btnVolver = $('#btnVolverDni');
    if(btnVolver) btnVolver.onclick = ()=>{ state.idNecesitaDatos=false; state.idDni=''; state.idNombre=''; state.idTel=''; render(); };

    $('#btnContinuarId').onclick = async ()=>{
      const alertBox = $('#idAlert');
      const dni = normalizarDni(state.idDni);
      if(dni.length<6){ alertBox.textContent='Ingresá un DNI válido (mínimo 6 dígitos).'; alertBox.style.display='block'; return; }

      if(!state.idNecesitaDatos){
        await loadData();
        const p = perfiles[dni];
        if(p){
          state.identidad = { dni: p.dni, nombre: p.nombre, telefono: p.telefono };
          state.view='dia'; render();
        }else{
          state.idNecesitaDatos = true; render();
        }
        return;
      }

      const nombre = state.idNombre.trim();
      const tel = state.idTel.trim();
      if(!nombre || !tel){ alertBox.textContent='Completá tu nombre y WhatsApp.'; alertBox.style.display='block'; return; }
      await loadData();
      const perfil = await upsertPerfil(nombre, tel, dni);
      state.identidad = { dni: perfil.dni, nombre: perfil.nombre, telefono: perfil.telefono };
      state.view='dia'; render();
    };
  }

  if(state.view==='dia'){
    $$('.day-chip').forEach(chip=>{ chip.onclick = ()=>{ state.fechaSel = chip.dataset.fecha; state.limiteMsg=''; render(); }; });

    $$('.time-card').forEach(card=>{
      if(card.dataset.cerrado==='true') return;
      card.onclick = async ()=>{
        const dia = nombreDiaSemana(parseFechaKey(state.fechaSel));
        const slot = getSlot(dia, card.dataset.slot);
        const full = card.dataset.full==='true';
        state.limiteMsg='';

        if(state.modoModificar){
          if(full){ alert('Ese horario está completo, elegí otro con cupo disponible.'); return; }
          const r = reservas.find(x=>x.id===state.modoModificar);
          if(!r) return;
          if(r.fecha===state.fechaSel && r.horaId===slot.id){ alert('Ya tenés ese turno.'); return; }
          await loadData();
          const perfil = perfiles[r.dni];
          const estado = mensajePlanEstado(perfil, state.fechaSel, r.id);
          if(estado.bloqueado){ state.limiteMsg = 'No podés mover el turno a esa semana: ya usaste tus clases de ese período según tu plan.'; render(); return; }
          const slotFresco = getSlot(dia, slot.id);
          if(cuposLibres(state.fechaSel, slotFresco) <= 0){ alert('Ese horario se completó. Elegí otro.'); render(); return; }
          const r2 = reservas.find(x=>x.id===state.modoModificar);
          r2.fecha = state.fechaSel; r2.dia = dia; r2.horaId = slot.id; r2.hora = slot.hora;
          await saveReservas();
          state.modoModificar = null; state.view='miSemana'; render();
          return;
        }

        if(full){
          state.slotSel = card.dataset.slot; state.modoEspera = true; state.carrito=[];
          state.view='form'; render(); return;
        }

        const yaEnCarrito = state.carrito.some(c=>c.fecha===state.fechaSel && c.horaId===slot.id);
        if(yaEnCarrito){
          state.carrito = state.carrito.filter(c=>!(c.fecha===state.fechaSel && c.horaId===slot.id));
          render();
          return;
        }

        await loadData();
        const perfil = perfiles[state.identidad.dni];
        const yaEnCarritoMismaSemana = state.carrito.filter(c=>{
          const inicioA = fechaKey(inicioSemana(parseFechaKey(c.fecha)));
          const inicioB = fechaKey(inicioSemana(parseFechaKey(state.fechaSel)));
          return inicioA===inicioB;
        }).length;
        const usadasPrevias = reservasEnSemanaDe(state.identidad.dni, state.fechaSel);
        const limite = limiteSemanal(perfil);
        if(limite!==Infinity && (usadasPrevias + yaEnCarritoMismaSemana + 1) > limite){
          state.limiteMsg = `Ya reservaste (o seleccionaste) tus ${limite} clases de esta semana según tu plan${perfil&&perfil.plan?' '+nombrePlan(perfil):''}. Elegí otra semana o hablá con tu profesor.`;
          render();
          return;
        }

        state.carrito.push({ fecha:state.fechaSel, dia, horaId:slot.id, hora:slot.hora });
        render();
      };
    });

    $$('.btn-quitar-carrito').forEach(btn=> btn.onclick = ()=>{ state.carrito.splice(+btn.dataset.idx,1); render(); });
    const btnContinuar = $('#btnContinuarCarrito');
    if(btnContinuar) btnContinuar.onclick = ()=>{ state.modoEspera=false; state.amigos=[]; state.view='form'; render(); };
  }

  if(state.view==='form'){
    const btnAgregar = $('#btnAgregarAmigo');
    if(btnAgregar) btnAgregar.onclick = ()=>{ state.amigos.push({nombre:'',telefono:''}); render(); };
    $$('.amigo-nombre').forEach(inp=> inp.oninput = e=>{ state.amigos[+e.target.dataset.idx].nombre = e.target.value; });
    $$('.amigo-tel').forEach(inp=> inp.oninput = e=>{ state.amigos[+e.target.dataset.idx].telefono = e.target.value; });
    $$('.btn-quitar-amigo').forEach(btn=> btn.onclick = ()=>{ state.amigos.splice(+btn.dataset.idx,1); render(); });

    $('#btnConfirmar').onclick = async ()=>{
      const alertBox = $('#formAlert');
      await loadData();
      const { dni, nombre, telefono } = state.identidad;

      if(state.modoEspera){
        const dia = nombreDiaSemana(parseFechaKey(state.fechaSel));
        const slot = getSlot(dia, state.slotSel);
        if(!slot){ alertBox.textContent='Ese horario ya no existe.'; alertBox.style.display='block'; return; }
        waitlist.push({ id:uid(), fecha:state.fechaSel, dia, horaId:slot.id, hora:slot.hora, nombre, telefono, dni, ts:Date.now(), estado:'esperando' });
        await saveWaitlist();
        state.view='confirmacion'; render();
        return;
      }

      if(state.carrito.length===0){ alertBox.textContent='Elegí al menos un horario.'; alertBox.style.display='block'; return; }

      // re-chequeo defensivo del límite semanal por si cambió algo entre pasos
      const perfil = perfiles[dni];
      const semanasEnCarrito = {};
      for(const item of state.carrito){
        const semanaKey = fechaKey(inicioSemana(parseFechaKey(item.fecha)));
        semanasEnCarrito[semanaKey] = (semanasEnCarrito[semanaKey]||0)+1;
      }
      const limite = limiteSemanal(perfil);
      if(limite!==Infinity){
        for(const semanaKey of Object.keys(semanasEnCarrito)){
          const usadas = reservasEnSemanaDe(dni, semanaKey);
          if(usadas + semanasEnCarrito[semanaKey] > limite){
            alertBox.textContent = `Según tu plan, ya no tenés cupo para todas las clases seleccionadas esa semana. Volvé y ajustá tu selección.`;
            alertBox.style.display='block';
            return;
          }
        }
      }

      const amigosValidos = state.carrito.length===1 ? state.amigos.filter(a=>a.nombre.trim() && a.telefono.trim()) : [];
      for(const item of state.carrito){
        const slot = getSlot(item.dia, item.horaId);
        const necesarios = 1 + amigosValidos.length;
        if(!slot || cuposLibres(item.fecha, slot) < necesarios){
          alertBox.textContent = `El turno del ${formatFechaLarga(item.fecha)} a las ${item.hora} ya no tiene cupo suficiente. Volvé y ajustalo.`;
          alertBox.style.display='block';
          return;
        }
      }

      const grupoId = amigosValidos.length>0 ? uid() : null;
      state.carrito.forEach(item=>{
        reservas.push({ id:uid(), fecha:item.fecha, dia:item.dia, horaId:item.horaId, hora:item.hora, nombre, telefono, dni, estado:'confirmada', ts:Date.now(), grupoId });
        amigosValidos.forEach(a=>{
          reservas.push({ id:uid(), fecha:item.fecha, dia:item.dia, horaId:item.horaId, hora:item.hora, nombre:a.nombre.trim(), telefono:a.telefono.trim(), dni:null, estado:'confirmada', ts:Date.now(), grupoId });
        });
      });
      await saveReservas();
      state.view='confirmacion'; render();
    };
  }

  if(state.view==='confirmacion'){
    $('#btnVolverInicio').onclick = ()=>{ state.view='home'; state.identidad=null; state.fechaSel=null; state.slotSel=null; state.modoEspera=false; state.carrito=[]; state.amigos=[]; render(); };
  }

  if(state.view==='testimonio'){
    const dniEl = $('#inpTestiDni'); if(dniEl) dniEl.oninput = e=>{ state.testiDni = e.target.value; };
    const btnBuscar = $('#btnBuscarTesti');
    if(btnBuscar) btnBuscar.onclick = async ()=>{
      const dni = normalizarDni(state.testiDni);
      const alertBox = $('#testiAlert');
      if(dni.length<6){ alertBox.textContent='Ingresá un DNI válido.'; alertBox.style.display='block'; return; }
      await loadData();
      state.testiPerfil = perfiles[dni] || null;
      render();
    };
    const textoEl = $('#inpTestiTexto'); if(textoEl) textoEl.oninput = e=>{ state.testiTexto = e.target.value; };
    const btnEnviar = $('#btnEnviarTesti');
    if(btnEnviar) btnEnviar.onclick = async ()=>{
      const texto = (textoEl.value||'').trim();
      const alertBox = $('#testiAlert');
      if(!texto){ alertBox.textContent='Escribí tu comentario antes de publicarlo.'; alertBox.style.display='block'; return; }
      const p = state.testiPerfil;
      await agregarTestimonio(p.dni, nombreSaludo(p.nombre, p.dni), texto);
      state.view='home'; render();
    };
  }

  if(state.view==='miSemana'){
    $('#inpBuscarDni').oninput = e=>{ state.buscarDni = e.target.value; };
    $('#btnBuscarMiSemana').onclick = async ()=>{
      if(normalizarDni(state.buscarDni).length<6){ const a=$('#miSemanaAlert'); a.textContent='Ingresá un DNI válido.'; a.style.display='block'; return; }
      await loadData(); render();
    };
    $$('.btn-cancelar-propia').forEach(btn=>{
      btn.onclick = async ()=>{
        if(btn.dataset.armed==='1'){
          const r = reservas.find(x=>x.id===btn.dataset.id);
          if(r){ r.estado='cancelada'; r.canceladaTs=Date.now(); }
          await saveReservas();
          render();
        }else{
          $$('.btn-cancelar-propia').forEach(b=>{b.dataset.armed='0'; b.textContent='Cancelar';});
          btn.dataset.armed='1'; btn.textContent='¿Seguro? Tocá de nuevo';
        }
      };
    });
    $$('.btn-modificar-propia').forEach(btn=>{
      btn.onclick = ()=>{
        const r = reservas.find(x=>x.id===btn.dataset.id);
        if(!r) return;
        state.identidad = { dni:r.dni, nombre:r.nombre, telefono:r.telefono };
        state.modoModificar = r.id;
        state.fechaSel=null; state.slotSel=null; state.modoEspera=false; state.carrito=[]; state.limiteMsg='';
        state.view='dia'; render();
      };
    });
    const btnReservarOtra = $('#btnReservarOtraDesdeMiSemana');
    if(btnReservarOtra) btnReservarOtra.onclick = ()=>{
      const dni = normalizarDni(state.buscarDni);
      const perfil = perfiles[dni];
      if(!perfil) return;
      state.identidad = { dni: perfil.dni, nombre: perfil.nombre, telefono: perfil.telefono };
      state.fechaSel=null; state.slotSel=null; state.modoEspera=false; state.modoModificar=null;
      state.carrito=[]; state.amigos=[]; state.limiteMsg='';
      state.view='dia'; render();
    };
    $$('.inp-comprobante').forEach(inp=>{
      inp.onchange = async ()=>{
        const file = inp.files[0];
        if(!file) return;
        await subirComprobante(file, inp.dataset.dni, 'alumno');
        render();
      };
    });
  }

  if(state.view==='adminPin'){
    const tryEnter = ()=>{
      const val = $('#inpPin').value.trim();
      if(val === CONFIG.adminPin){ state.isAdmin=true; state.view='admin'; state.adminTab='dashboard'; render(); }
      else{ const a=$('#pinAlert'); a.textContent='PIN incorrecto.'; a.style.display='block'; }
    };
    $('#btnEntrar').onclick = tryEnter;
    $('#inpPin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
  }

  if(state.view==='admin'){
    $$('.admin-tab').forEach(t=> t.onclick = async ()=>{ state.adminTab = t.dataset.tab; state.horariosCopiados=null; await loadData(); render(); });

    if(state.adminTab==='agenda'){
      $$('.btn-asistencia').forEach(btn=>{
        btn.onclick = async ()=>{
          const r = reservas.find(x=>x.id===btn.dataset.id);
          if(!r) return;
          const valor = btn.dataset.valor;
          r.asistio = valor==='null' ? null : (valor==='true');
          r.asistioTs = Date.now();
          await saveReservas();
          render();
        };
      });
      $$('.btn-cancel-reserva').forEach(btn=>{
        btn.onclick = async ()=>{
          if(btn.dataset.armed==='1'){
            const { id, fecha, hora, nombre, tel, dni } = btn.dataset;
            window.open(waLink(tel, mensajeCancelacion(nombre, dni||null, fecha, hora)), '_blank');
            const r = reservas.find(x=>x.id===id);
            if(r){ r.estado='cancelada'; r.canceladaTs=Date.now(); }
            await saveReservas();
            render();
          }else{
            $$('.btn-cancel-reserva').forEach(b=>{b.dataset.armed='0'; b.classList.remove('danger-confirm');});
            btn.dataset.armed='1'; btn.classList.add('danger-confirm'); btn.title='Tocá de nuevo para confirmar';
          }
        };
      });
      $$('.btn-ofrecer-espera').forEach(btn=>{
        btn.onclick = ()=>{
          const w = waitlist.find(x=>x.id===btn.dataset.id);
          if(!w) return;
          window.open(waLink(w.telefono, mensajeOfertaEspera(w.nombre, w.dni, w.fecha, w.hora)), '_blank');
          w.estado='ofrecida'; w.ofrecidaTs=Date.now();
          saveWaitlist().then(render);
        };
      });
      $$('.btn-confirmar-espera').forEach(btn=>{
        btn.onclick = async ()=>{
          const w = waitlist.find(x=>x.id===btn.dataset.id);
          if(!w) return;
          const dia = nombreDiaSemana(parseFechaKey(w.fecha));
          const slot = getSlot(dia, w.horaId);
          if(!slot || cuposLibres(w.fecha, slot) <= 0){ alert('Ya no hay cupo disponible para asignarle.'); return; }
          reservas.push({ id:uid(), fecha:w.fecha, dia, horaId:w.horaId, hora:w.hora, nombre:w.nombre, telefono:w.telefono, dni:w.dni||null, estado:'confirmada', ts:Date.now(), grupoId:null });
          waitlist = waitlist.filter(x=>x.id!==w.id);
          await saveReservas(); await saveWaitlist([w.id]);
          render();
        };
      });
      $$('.btn-descartar-espera').forEach(btn=>{
        btn.onclick = async ()=>{
          const idBorrado = btn.dataset.id;
          waitlist = waitlist.filter(x=>x.id!==idBorrado);
          await saveWaitlist([idBorrado]);
          render();
        };
      });
    }

    if(state.adminTab==='horarios'){
      $$('.inp-cupo').forEach(inp=>{
        inp.onchange = async ()=>{
          const slot = getSlot(inp.dataset.dia, inp.dataset.id);
          if(slot){ slot.cupoMax = Math.max(0, parseInt(inp.value)||0); await saveSchedule(); render(); }
        };
      });
      $$('.btn-del-slot').forEach(btn=>{
        btn.onclick = async ()=>{
          if(btn.dataset.armed==='1'){
            const dia = btn.dataset.dia, id = btn.dataset.id;
            reservas.forEach(r=>{ if(r.dia===dia && r.horaId===id && r.estado!=='cancelada'){ r.estado='cancelada'; r.canceladaTs=Date.now(); } });
            const idsEsperaBorrados = waitlist.filter(w=> w.dia===dia && w.horaId===id).map(w=>w.id);
            waitlist = waitlist.filter(w=> !(w.dia===dia && w.horaId===id));
            schedule[dia] = schedule[dia].filter(s=>s.id!==id);
            await saveSchedule([id]); await saveReservas(); await saveWaitlist(idsEsperaBorrados);
            render();
          }else{
            $$('.btn-del-slot').forEach(b=>{b.dataset.armed='0'; b.classList.remove('danger-confirm');});
            btn.dataset.armed='1'; btn.classList.add('danger-confirm'); btn.title='Tocá de nuevo para confirmar';
          }
        };
      });
      $$('.btn-add-slot').forEach(btn=>{
        btn.onclick = async ()=>{
          const dia = btn.dataset.dia;
          const horaEl = document.getElementById('newHora_'+dia);
          const cupoEl = document.getElementById('newCupo_'+dia);
          const hora = (horaEl.value||'').trim();
          const cupo = Math.max(1, parseInt(cupoEl.value)||1);
          if(!/^([01]\d|2[0-3]):([0-5]\d)$/.test(hora)){ horaEl.style.borderColor='var(--warn)'; horaEl.placeholder='Formato HH:MM'; return; }
          const id = dia+'__'+hora;
          if(!schedule[dia]) schedule[dia]=[];
          if(schedule[dia].some(s=>s.id===id)) return;
          schedule[dia].push({ id, hora, cupoMax: cupo });
          await saveSchedule();
          render();
        };
      });
      $$('.btn-copiar-horario').forEach(btn=>{
        btn.onclick = ()=>{ state.horariosCopiados = { origen: btn.dataset.dia, slots: (schedule[btn.dataset.dia]||[]).map(s=>({hora:s.hora, cupoMax:s.cupoMax})) }; render(); };
      });
      $$('.btn-pegar-horario').forEach(btn=>{ btn.onclick = async ()=>{ await pegarHorariosEn(btn.dataset.dia); render(); }; });
      const btnPegarTodos = $('#btnPegarTodos');
      if(btnPegarTodos) btnPegarTodos.onclick = async ()=>{
        const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
        for(const dia of dias){ if(dia!==state.horariosCopiados.origen) await pegarHorariosEn(dia); }
        render();
      };
      const btnDescartarCopia = $('#btnDescartarCopia');
      if(btnDescartarCopia) btnDescartarCopia.onclick = ()=>{ state.horariosCopiados=null; render(); };
    }

    if(state.adminTab==='alumnos'){
      const btnMostrarNuevo = $('#btnMostrarNuevoAlumno');
      if(btnMostrarNuevo) btnMostrarNuevo.onclick = ()=>{ state.mostrarNuevoAlumno=true; state.naNombre=''; state.naTel=''; state.naDni=''; state.naPlan=''; state.naPerso=''; render(); };
      const btnCancelarNuevo = $('#btnCancelarNuevoAlumno');
      if(btnCancelarNuevo) btnCancelarNuevo.onclick = ()=>{ state.mostrarNuevoAlumno=false; render(); };
      const naNombreEl = $('#naNombre'); if(naNombreEl) naNombreEl.oninput = e=>{ state.naNombre = e.target.value; };
      const naTelEl = $('#naTel'); if(naTelEl) naTelEl.oninput = e=>{ state.naTel = e.target.value; };
      const naDniEl = $('#naDni'); if(naDniEl) naDniEl.oninput = e=>{ state.naDni = e.target.value; };
      const naPlanEl = $('#naPlan'); if(naPlanEl) naPlanEl.onchange = e=>{ state.naPlan = e.target.value; render(); };
      const naPersoEl = $('#naPerso'); if(naPersoEl) naPersoEl.oninput = e=>{ state.naPerso = e.target.value; };
      const btnGuardarNuevo = $('#btnGuardarNuevoAlumno');
      if(btnGuardarNuevo) btnGuardarNuevo.onclick = async ()=>{
        const alertBox = $('#nuevoAlumnoAlert');
        const dni = normalizarDni(state.naDni);
        const nombre = state.naNombre.trim();
        const tel = state.naTel.trim();
        if(dni.length<6 || !nombre || !tel){ alertBox.textContent='Completá nombre, WhatsApp y DNI (mínimo 6 dígitos).'; alertBox.style.display='block'; return; }
        await loadData();
        if(perfiles[dni]){ alertBox.textContent=`Ya existe un alumno con ese DNI: ${perfiles[dni].nombre}. Buscalo arriba para editarlo.`; alertBox.style.display='block'; return; }
        perfiles[dni] = {
          nombre, telefono: tel, dni, apodo:'', fechaNac:'',
          plan: state.naPlan || null,
          clasesPersoPorSemana: state.naPlan==='perso' ? (state.naPerso==='' ? null : Math.max(0, parseInt(state.naPerso)||0)) : null,
          creado:true, actualizado:Date.now(),
        };
        await savePerfiles();
        state.mostrarNuevoAlumno=false;
        render();
      };

      const buscar = $('#inpBuscarAlumno');
      if(buscar) buscar.oninput = e=>{ state.filtroAlumno = e.target.value; render(); };
      const chkTodos = $('#chkTodos');
      if(chkTodos) chkTodos.onchange = ()=>{ $$('.chk-alumno').forEach(c=> c.checked = chkTodos.checked); };
      const btnTodos = $('#btnRecordarTodos');
      if(btnTodos) btnTodos.onclick = ()=>{
        const seleccionados = $$('.chk-alumno').filter(c=>c.checked);
        if(seleccionados.length===0){ alert('Seleccioná al menos un alumno.'); return; }
        seleccionados.forEach((c,i)=>{ setTimeout(()=>{ window.open(waLink(c.value, mensajeRecordatorio(c.dataset.nombre, c.dataset.dni)), '_blank'); }, i*350); });
      };
      $$('.inp-apodo').forEach(inp=>{ inp.onchange = async ()=>{ if(perfiles[inp.dataset.dni]){ perfiles[inp.dataset.dni].apodo = inp.value.trim(); await savePerfiles(); render(); } }; });
      $$('.inp-fecha-nac').forEach(inp=>{ inp.onchange = async ()=>{ if(perfiles[inp.dataset.dni]){ perfiles[inp.dataset.dni].fechaNac = inp.value; await savePerfiles(); render(); } }; });
      $$('.sel-plan').forEach(sel=>{
        sel.onchange = async ()=>{
          if(perfiles[sel.dataset.dni]){
            perfiles[sel.dataset.dni].plan = sel.value || null;
            await savePerfiles();
            render();
          }
        };
      });
      $$('.inp-perso').forEach(inp=>{
        inp.onchange = async ()=>{
          if(perfiles[inp.dataset.dni]){
            perfiles[inp.dataset.dni].clasesPersoPorSemana = inp.value==='' ? null : Math.max(0, parseInt(inp.value)||0);
            await savePerfiles();
            render();
          }
        };
      });
      $$('.btn-ver-ficha').forEach(btn=>{
        btn.onclick = ()=>{ state.adminAlumnoDni = btn.dataset.dni; state.adminAlumnoTab='pagos'; state.registroDiaId=''; state.registroExtra=[]; state.view='adminAlumno'; render(); };
      });
      const btnMostrarNuevoGrupo = $('#btnMostrarNuevoGrupo');
      if(btnMostrarNuevoGrupo) btnMostrarNuevoGrupo.onclick = ()=>{ state.mostrarNuevoGrupo=true; state.ngNombre=''; render(); };
      const btnCancelarGrupo = $('#btnCancelarGrupo');
      if(btnCancelarGrupo) btnCancelarGrupo.onclick = ()=>{ state.mostrarNuevoGrupo=false; render(); };
      const ngNombreEl = $('#ngNombre'); if(ngNombreEl) ngNombreEl.oninput = e=>{ state.ngNombre = e.target.value; };
      const btnGuardarGrupo = $('#btnGuardarGrupo');
      if(btnGuardarGrupo) btnGuardarGrupo.onclick = async ()=>{
        const nombre = state.ngNombre.trim();
        if(!nombre) return;
        await crearGrupo(nombre);
        state.mostrarNuevoGrupo=false;
        render();
      };
      $$('.btn-ver-grupo').forEach(btn=>{
        btn.onclick = ()=>{ state.adminGrupoId = btn.dataset.id; state.filtroAlumno=''; state.view='adminGrupo'; render(); };
      });
    }

    if(state.adminTab==='portada'){
      $$('.portada-field').forEach(inp=>{
        inp.onchange = async ()=>{ CONFIG[inp.dataset.campo] = inp.value; await saveConfig(); render(); };
      });
      $$('.plan-field').forEach(inp=>{
        inp.onchange = async ()=>{
          const plan = CONFIG.planes[inp.dataset.plan];
          if(!plan) return;
          if(inp.dataset.campo==='clasesPorSemana'){ plan.clasesPorSemana = inp.value===''? null : parseInt(inp.value)||0; }
          else{ plan[inp.dataset.campo] = inp.value; }
          await saveConfig();
          render();
        };
      });
      const inpNuevaFoto = $('#inpNuevaFoto');
      if(inpNuevaFoto) inpNuevaFoto.onchange = async ()=>{
        const file = inpNuevaFoto.files[0];
        if(!file) return;
        await subirFotoPortada(file);
        render();
      };
      $$('.btn-quitar-foto').forEach(btn=>{
        btn.onclick = async ()=>{ CONFIG.fotos.splice(+btn.dataset.idx,1); await saveConfig(); render(); };
      });
      $$('.profesor-field').forEach(inp=>{
        inp.onchange = async ()=>{
          const p = CONFIG.profesores.find(x=>x.id===inp.dataset.id);
          if(p){ p[inp.dataset.campo] = inp.value.trim(); await saveConfig(); render(); }
        };
      });
      $$('.inp-foto-profesor').forEach(inp=>{
        inp.onchange = async ()=>{
          const file = inp.files[0];
          if(!file) return;
          await subirFotoProfesor(file, inp.dataset.id);
          render();
        };
      });
      const btnAgregarProfesor = $('.btn-agregar-profesor');
      if(btnAgregarProfesor) btnAgregarProfesor.onclick = async ()=>{
        CONFIG.profesores.push({ id:uid(), nombre:'', telefono:'', foto:'' });
        await saveConfig();
        render();
      };
      $$('.btn-borrar-profesor').forEach(btn=>{
        btn.onclick = async ()=>{
          if(btn.dataset.armed==='1'){
            CONFIG.profesores = CONFIG.profesores.filter(p=>p.id!==btn.dataset.id);
            await saveConfig();
            render();
          }else{
            $$('.btn-borrar-profesor').forEach(b=>{b.dataset.armed='0'; b.classList.remove('danger-confirm');});
            btn.dataset.armed='1'; btn.classList.add('danger-confirm'); btn.title='Tocá de nuevo para confirmar';
          }
        };
      });
    }
  }

  if(state.view==='adminAlumno'){
    $$('.admin-tab').forEach(t=> t.onclick = ()=>{ state.adminAlumnoTab = t.dataset.atab; render(); });
    if(state.adminAlumnoTab==='pagos') bindComprobanteEvents($$);
    if(state.adminAlumnoTab==='rutina') bindRutinaEditorEvents($, $$, { dni: state.adminAlumnoDni });
    if(state.adminAlumnoTab==='progreso'){
      const selDia = $('#selRegistroDia');
      if(selDia) selDia.onchange = e=>{ state.registroDiaId = e.target.value; state.registroExtra=[]; render(); };
      const fechaEl = $('#inpRegistroFecha');
      if(fechaEl) fechaEl.onchange = e=>{ state.registroFecha = e.target.value; };
      const btnAgregarExtra = $('#btnAgregarExtra');
      if(btnAgregarExtra) btnAgregarExtra.onclick = ()=>{ state.registroExtra.push({nombre:'',series:null,repeticiones:null,peso:null}); render(); };
      $$('.reg-extra-nombre').forEach(inp=> inp.oninput = e=>{ state.registroExtra[+e.target.dataset.idx].nombre = e.target.value; });
      $$('.reg-extra-series').forEach(inp=> inp.oninput = e=>{ state.registroExtra[+e.target.dataset.idx].series = parseInt(e.target.value)||null; });
      $$('.reg-extra-reps').forEach(inp=> inp.oninput = e=>{ state.registroExtra[+e.target.dataset.idx].repeticiones = parseInt(e.target.value)||null; });
      $$('.reg-extra-peso').forEach(inp=> inp.oninput = e=>{ state.registroExtra[+e.target.dataset.idx].peso = e.target.value===''?null:parseFloat(e.target.value); });
      $$('.btn-quitar-extra').forEach(btn=> btn.onclick = ()=>{ state.registroExtra.splice(+btn.dataset.idx,1); render(); });
      const btnGuardarRegistro = $('#btnGuardarRegistro');
      if(btnGuardarRegistro) btnGuardarRegistro.onclick = async ()=>{
        const dni = state.adminAlumnoDni;
        const fecha = ($('#inpRegistroFecha').value) || hoyKey();
        const filas = $$('.ejercicio-row[data-plan-id]');
        for(const fila of filas){
          const planId = fila.dataset.planId;
          const plan = rutinaEjercicios.find(e=>e.id===planId);
          const series = parseInt(fila.querySelector('.reg-series').value)||null;
          const reps = parseInt(fila.querySelector('.reg-reps').value)||null;
          const pesoVal = fila.querySelector('.reg-peso').value;
          const peso = pesoVal===''?null:parseFloat(pesoVal);
          if(series==null && reps==null && peso==null) continue;
          await guardarRegistro(dni, fecha, plan.nombre, series, reps, peso, false, planId);
        }
        for(const ex of state.registroExtra){
          if(!ex.nombre || !ex.nombre.trim()) continue;
          await guardarRegistro(dni, fecha, ex.nombre.trim(), ex.series, ex.repeticiones, ex.peso, true, null);
        }
        state.registroExtra=[];
        render();
      };
    }
  }

  if(state.view==='adminGrupo'){
    bindRutinaEditorEvents($, $$, { grupoId: state.adminGrupoId });
    const buscar = $('#inpBuscarAlumno');
    if(buscar) buscar.oninput = e=>{ state.filtroAlumno = e.target.value; render(); };
    $$('.chk-miembro-grupo').forEach(chk=>{
      chk.onchange = async ()=>{
        const p = perfiles[chk.dataset.dni];
        if(!p) return;
        p.grupoId = chk.checked ? state.adminGrupoId : null;
        await savePerfiles();
        render();
      };
    });
    const btnBorrarGrupo = $('#btnBorrarGrupo');
    if(btnBorrarGrupo) btnBorrarGrupo.onclick = async ()=>{
      if(btnBorrarGrupo.dataset.armed==='1'){
        await borrarGrupo(state.adminGrupoId);
        state.view='admin'; state.adminTab='alumnos'; render();
      }else{
        btnBorrarGrupo.dataset.armed='1'; btnBorrarGrupo.textContent='¿Seguro? Tocá de nuevo';
      }
    };
  }
}

function bindRutinaEditorEvents($, $$, target){
  const btnAgregarDiaEl = $('.btn-agregar-dia');
  if(btnAgregarDiaEl) btnAgregarDiaEl.onclick = async ()=>{
    const nombreDia = ($('#nuevoDiaNombre').value||'').trim();
    if(!nombreDia) return;
    await crearRutinaDia(target, nombreDia);
    render();
  };
  $$('.btn-agregar-ejercicio').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const nombre = ($(`#ejNombre_${id}`).value||'').trim();
      if(!nombre) return;
      const series = parseInt($(`#ejSeries_${id}`).value)||null;
      const reps = parseInt($(`#ejReps_${id}`).value)||null;
      const pesoVal = $(`#ejPeso_${id}`).value;
      const peso = pesoVal==='' ? null : parseFloat(pesoVal);
      await agregarEjercicio(id, nombre, series, reps, peso);
      render();
    };
  });
  $$('.btn-borrar-ejercicio').forEach(btn=>{ btn.onclick = async ()=>{ await borrarEjercicio(btn.dataset.id); render(); }; });
  $$('.btn-borrar-rutina-dia').forEach(btn=>{ btn.onclick = async ()=>{ await borrarRutinaDia(btn.dataset.id); render(); }; });
  $$('.btn-copiar-rutina-dia').forEach(btn=>{
    btn.onclick = ()=>{
      state.rutinaCopiada = { nombreDia: btn.dataset.nombre, ejercicios: ejerciciosDe(btn.dataset.id).map(e=>({nombre:e.nombre, series:e.series, repeticiones:e.repeticiones, peso:e.peso})) };
      render();
    };
  });
  const btnPegar = $('.btn-pegar-rutina-dia');
  if(btnPegar) btnPegar.onclick = async ()=>{ await pegarRutinaDiaEn(target); render(); };
  const btnDescartarCopiaRutina = $('#btnDescartarCopiaRutina');
  if(btnDescartarCopiaRutina) btnDescartarCopiaRutina.onclick = ()=>{ state.rutinaCopiada=null; render(); };
}

function bindComprobanteEvents($$){
  $$('.inp-comprobante').forEach(inp=>{
    inp.onchange = async ()=>{
      const file = inp.files[0];
      if(!file) return;
      await subirComprobante(file, inp.dataset.dni, inp.dataset.contexto==='entrenador'?'entrenador':'alumno');
      render();
    };
  });
}

async function pegarHorariosEn(diaDestino){
  const copia = state.horariosCopiados;
  if(!copia) return;
  const nuevosSlots = copia.slots.map(s=>({ id: diaDestino+"__"+s.hora, hora:s.hora, cupoMax:s.cupoMax }));
  const nuevosIds = new Set(nuevosSlots.map(s=>s.id));
  const idsViejos = (schedule[diaDestino]||[]).map(s=>s.id).filter(id=>!nuevosIds.has(id));
  reservas.forEach(r=>{ if(r.dia===diaDestino && idsViejos.includes(r.horaId) && r.estado!=='cancelada'){ r.estado='cancelada'; r.canceladaTs=Date.now(); } });
  const idsEsperaBorrados = waitlist.filter(w=> w.dia===diaDestino && idsViejos.includes(w.horaId)).map(w=>w.id);
  waitlist = waitlist.filter(w=> !(w.dia===diaDestino && idsViejos.includes(w.horaId)));
  schedule[diaDestino] = nuevosSlots;
  await saveSchedule(idsViejos); await saveReservas(); await saveWaitlist(idsEsperaBorrados);
}

/* ======================================================================
   INIT
   ====================================================================== */
(async function init(){
  app.innerHTML = `<div class="pad" style="padding-top:60px;color:var(--muted);text-align:center;">Cargando…</div>`;
  await loadData();
  render();
})();
</script>
</body>
